services:
  srcvisual:
    image: srcvisual:local
    build:
      context: ..
      dockerfile: srcVisual/Dockerfile
    init: true
    read_only: true
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      PORT: "5000"
      # Historical comparisons can legitimately take several minutes.
      SRCVISUAL_COMMAND_TIMEOUT_SECONDS: "300"
      SRCVISUAL_MAX_CONTENT_LENGTH_MB: "32"
      SRCVISUAL_GUNICORN_WORKERS: "2"
      SRCVISUAL_GUNICORN_THREADS: "4"
      SRCVISUAL_GUNICORN_TIMEOUT_SECONDS: "360"
      SRCVISUAL_HISTORY_REPOSITORY: "/history/repository"
      SRCVISUAL_ARTIFACT_ROOT: "/var/lib/srcvisual/artifacts"
      SRCVISUAL_TMP_ROOT: "/tmp/srcvisual"
    volumes:
      - srcvisual-artifacts:/var/lib/srcvisual/artifacts
      # The parent workspace builds this Linux executable incrementally. The
      # bind applies to long-running services and `docker compose run`.
      - ../srcMove/build/srcMove:/opt/srcMove/bin/srcMove:ro
      - ../srcMove/reference-repositories/notepadpp:/history/repository:ro
      # srcmove-history owns these two repository-local areas. The source
      # working tree remains read-only while repository analysis and retained
      # comparisons can update their own state.
      - ../srcMove/reference-repositories/notepadpp/.git:/history/repository/.git:rw
      - ../srcMove/reference-repositories/notepadpp/.srcmove:/history/repository/.srcmove:rw
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /dev/shm

  history-worker:
    image: srcvisual:local
    command: ["/opt/venv/bin/history-worker"]
    init: true
    read_only: true
    environment:
      SRCVISUAL_COMMAND_TIMEOUT_SECONDS: "300"
      SRCVISUAL_HISTORY_REPOSITORY: "/history/repository"
      SRCVISUAL_ARTIFACT_ROOT: "/var/lib/srcvisual/artifacts"
      SRCVISUAL_TMP_ROOT: "/tmp/srcvisual"
    volumes:
      - srcvisual-artifacts:/var/lib/srcvisual/artifacts
      - ../srcMove/build/srcMove:/opt/srcMove/bin/srcMove:ro
      - ../srcMove/reference-repositories/notepadpp:/history/repository:ro
      - ../srcMove/reference-repositories/notepadpp/.git:/history/repository/.git:rw
      - ../srcMove/reference-repositories/notepadpp/.srcmove:/history/repository/.srcmove:rw
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /dev/shm
    healthcheck:
      disable: true

volumes:
  srcvisual-artifacts:
